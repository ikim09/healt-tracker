
workflows:
  ios-release:
    name: HealthTracker iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Admin
    environment:
      node: 22.12.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.ikim.healthtracker
        APP_VERSION: "1.0.3"
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: |
          npm run build
          # I file OCR devono essere inclusi nell'app per funzionare offline
          if [ ! -f dist/tessdata/ita.traineddata.gz ]; then
            echo "ATTENZIONE: dati OCR mancanti nella build"; exit 1
          fi
          echo "Dati OCR inclusi correttamente"

      - name: Capacitor CLI
        script: npm install -g @capacitor/cli

      - name: Add iOS
        script: |
          npm install @capacitor/ios
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync
        script: npx cap sync ios

      - name: Generate app icons
        script: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --ios

      - name: Add privacy usage descriptions
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Consente di scattare foto dei referti medici da allegare a visite e analisi'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Consente di selezionare immagini dei referti da allegare a visite e analisi'" "$PLIST"
          echo "===== Chiavi privacy aggiunte a Info.plist ====="

      - name: Declare supported languages
        script: |
          PLIST="ios/App/App/Info.plist"
          # Lingua principale: italiano
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDevelopmentRegion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string it" "$PLIST"
          # Lingue in cui l'app è disponibile (compaiono sulla scheda App Store)
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          for L in it en es fr de; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations: string $L" "$PLIST"
          done
          echo "===== Lingue dichiarate: it en es fr de ====="

      - name: Set iPhone only and clean entitlements
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          # Solo iPhone
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 1/g' "$PBXPROJ"
          echo "App impostata come solo iPhone"

          # Rimuovi ogni riferimento a Game Center dal progetto Xcode
          sed -i '' '/com.apple.developer.game-center/d' "$PBXPROJ"
          sed -i '' '/GameKit/d' "$PBXPROJ"
          echo "Riferimenti Game Center rimossi dal progetto"

          # Pulisci anche i file entitlements
          echo "===== FILE ENTITLEMENTS ====="
          find ios -name "*.entitlements"
          for f in $(find ios -name "*.entitlements"); do
            echo "Sovrascrivo con entitlements pulito: $f"
            cat > "$f" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF
            cat "$f"
          done

      - name: CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;

      - name: Set up keychain
        script: keychain initialize

      - name: Generate private key for certificate
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/dist_key -q -N ""
          echo "Chiave privata generata in /tmp/dist_key"

      - name: Create distribution certificate
        script: |
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/dist_key \
            --save || echo "Certificato gia esistente, proseguo"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_key \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply profiles
        script: xcode-project use-profiles

      - name: Set version and build number
        script: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version $APP_VERSION
        working_directory: ios/App

      - name: Build IPA
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false